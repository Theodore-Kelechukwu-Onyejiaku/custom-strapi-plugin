<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #32324D; }
    .title { font-size: 34px; font-weight: 700; fill: #212134; }
    .sub { font-size: 19px; fill: #666687; }
    .group { font-size: 18px; font-weight: 700; letter-spacing: 1px; fill: #666687; }
    .name { font-size: 21px; font-weight: 700; fill: #212134; }
    .note { font-size: 15.5px; fill: #666687; }
    .num { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
    .err { font-size: 15px; fill: #B72B1A; }
    .ok { font-size: 15px; fill: #2F6846; }
    .src { font-size: 19px; font-weight: 700; fill: #212134; }
    .card { fill: #FFFFFF; stroke: #DCDCE4; stroke-width: 2; }
    .line { stroke: #8E8EA9; stroke-width: 2.5; fill: none; }
    .accent { stroke: #4945FF; stroke-width: 3; fill: none; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8E8EA9"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4945FF"/></marker>
  </defs>

  <rect width="1600" height="690" fill="#F6F6F9"/>
  <text x="40" y="62" class="title">One publish path, six steps</text>
  <text x="40" y="94" class="sub">publishEntry() in services/publish.ts. The table, the Content Manager panel and the chat all end here.</text>

  <!-- sources -->
  <rect x="300" y="130" width="300" height="60" rx="30" class="card"/>
  <text x="450" y="167" class="src" text-anchor="middle">Publishing table</text>
  <rect x="650" y="130" width="300" height="60" rx="30" class="card"/>
  <text x="800" y="167" class="src" text-anchor="middle">Content Manager panel</text>
  <rect x="1000" y="130" width="300" height="60" rx="30" class="card" stroke="#4945FF"/>
  <text x="1150" y="167" class="src" text-anchor="middle" style="fill:#4945FF">Chat · publish_post tool</text>
  <path d="M450 190 L450 215 L800 215" class="line"/>
  <path d="M1150 190 L1150 215 L800 215" class="accent"/>
  <path d="M800 190 L800 250" class="line" marker-end="url(#g)"/>
  <rect x="300" y="250" width="1000" height="6" rx="3" fill="#4945FF"/>

  <!-- step template: width 228, gap 26, start x=40 -->
  <g>
    <rect x="40" y="290" width="228" height="180" rx="14" class="card"/>
    <circle cx="74" cy="326" r="18" fill="#4945FF"/><text x="74" y="332" class="num" text-anchor="middle">1</text>
    <text x="104" y="333" class="name">Turned on?</text>
    <text x="58" y="380" class="note">settings.enabled for</text>
    <text x="58" y="404" class="note">this platform. Missing</text>
    <text x="58" y="428" class="note">means on.</text>
  </g>
  <g>
    <rect x="294" y="290" width="228" height="180" rx="14" class="card"/>
    <circle cx="328" cy="326" r="18" fill="#4945FF"/><text x="328" y="332" class="num" text-anchor="middle">2</text>
    <text x="358" y="333" class="name">Credentials</text>
    <text x="312" y="380" class="note">API keys from .env, or</text>
    <text x="312" y="404" class="note">the signed-in account's</text>
    <text x="312" y="428" class="note">decrypted token.</text>
  </g>
  <g>
    <rect x="548" y="290" width="228" height="180" rx="14" class="card"/>
    <circle cx="582" cy="326" r="18" fill="#4945FF"/><text x="582" y="332" class="num" text-anchor="middle">3</text>
    <text x="612" y="333" class="name">Find the entry</text>
    <text x="566" y="380" class="note">contentType + entryId</text>
    <text x="566" y="404" class="note">from the tracking record,</text>
    <text x="566" y="428" class="note">populated one level.</text>
  </g>
  <g>
    <rect x="802" y="290" width="228" height="180" rx="14" class="card"/>
    <circle cx="836" cy="326" r="18" fill="#4945FF"/><text x="836" y="332" class="num" text-anchor="middle">4</text>
    <text x="866" y="333" class="name">Read via map</text>
    <text x="820" y="380" class="note">The saved mapping turns</text>
    <text x="820" y="404" class="note">the entry into the</text>
    <text x="820" y="428" class="note">platform's own fields.</text>
  </g>
  <g>
    <rect x="1056" y="290" width="228" height="180" rx="14" class="card"/>
    <circle cx="1090" cy="326" r="18" fill="#4945FF"/><text x="1090" y="332" class="num" text-anchor="middle">5</text>
    <text x="1120" y="333" class="name">Send</text>
    <text x="1074" y="380" class="note">The platform's publisher</text>
    <text x="1074" y="404" class="note">makes one request and</text>
    <text x="1074" y="428" class="note">returns the post's URL.</text>
  </g>
  <g>
    <rect x="1310" y="290" width="250" height="180" rx="14" fill="#4945FF"/>
    <circle cx="1344" cy="326" r="18" fill="#FFFFFF"/><text x="1344" y="332" class="num" text-anchor="middle" style="fill:#4945FF">6</text>
    <text x="1374" y="333" class="name" style="fill:#FFFFFF">Record the URL</text>
    <text x="1328" y="380" class="note" style="fill:#DCDCFF">e.g. devToLink on the</text>
    <text x="1328" y="404" class="note" style="fill:#DCDCFF">tracking record. The table</text>
    <text x="1328" y="428" class="note" style="fill:#DCDCFF">and chat now show it.</text>
  </g>

  <path d="M268 380 L290 380" class="line" marker-end="url(#g)"/>
  <path d="M522 380 L544 380" class="line" marker-end="url(#g)"/>
  <path d="M776 380 L798 380" class="line" marker-end="url(#g)"/>
  <path d="M1030 380 L1052 380" class="line" marker-end="url(#g)"/>
  <path d="M1284 380 L1306 380" class="line" marker-end="url(#g)"/>

  <!-- failure notes -->
  <text x="40" y="520" class="group">IF IT STOPS, THE EDITOR (OR THE MODEL) IS TOLD WHY</text>
  <rect x="40" y="540" width="228" height="104" rx="12" fill="#FCECEA"/>
  <text x="56" y="574" class="err">“Dev.to is turned off</text>
  <text x="56" y="596" class="err">in the publishing</text>
  <text x="56" y="618" class="err">settings.”</text>

  <rect x="294" y="540" width="228" height="104" rx="12" fill="#FCECEA"/>
  <text x="310" y="574" class="err">“LinkedIn is not</text>
  <text x="310" y="596" class="err">connected. Connect it in</text>
  <text x="310" y="618" class="err">the publishing settings.”</text>

  <rect x="548" y="540" width="228" height="104" rx="12" fill="#FCECEA"/>
  <text x="564" y="574" class="err">“The entry this record</text>
  <text x="564" y="596" class="err">points at no longer</text>
  <text x="564" y="618" class="err">exists.”</text>

  <rect x="802" y="540" width="228" height="104" rx="12" fill="#FCECEA"/>
  <text x="818" y="574" class="err">“No Dev.to field mapping</text>
  <text x="818" y="596" class="err">saved for api::article.</text>
  <text x="818" y="618" class="err">article.”</text>

  <rect x="1056" y="540" width="228" height="104" rx="12" fill="#FCECEA"/>
  <text x="1072" y="574" class="err">“Could not publish to</text>
  <text x="1072" y="596" class="err">Medium: Request failed</text>
  <text x="1072" y="618" class="err">with status code 429”</text>

  <rect x="1310" y="540" width="250" height="104" rx="12" fill="#EAFBE7"/>
  <text x="1326" y="574" class="ok">Returns { url }.</text>
  <text x="1326" y="596" class="ok">The chat hands the link</text>
  <text x="1326" y="618" class="ok">back to the editor.</text>
</svg>
