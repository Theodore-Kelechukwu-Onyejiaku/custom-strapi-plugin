<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #32324D; }
    .title { font-size: 34px; font-weight: 700; fill: #212134; }
    .sub { font-size: 19px; fill: #666687; }
    .actor { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
    .actorsub { font-size: 14px; fill: #DCDCFF; }
    .msg { font-size: 17px; fill: #212134; paint-order: stroke; stroke: #F6F6F9; stroke-width: 8px; stroke-linejoin: round; }
    .ret { font-size: 16px; fill: #666687; font-style: italic; paint-order: stroke; stroke: #F6F6F9; stroke-width: 8px; stroke-linejoin: round; }
    .step { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .gate { font-size: 17px; font-weight: 700; fill: #8A4B00; }
    .life { stroke: #C0C0CF; stroke-width: 2; stroke-dasharray: 6 6; }
    .call { stroke: #4A4A6A; stroke-width: 2.5; fill: none; }
    .back { stroke: #8E8EA9; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    .human { stroke: #D9822F; stroke-width: 3; fill: none; }
  </style>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A4A6A"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8E8EA9"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9822F"/></marker>
  </defs>

  <rect width="1600" height="1180" fill="#F6F6F9"/>
  <text x="40" y="62" class="title">“Publish my newest post to Bluesky”</text>
  <text x="40" y="94" class="sub">What happens between the question and the live URL. The model proposes; only the editor's click lets the publish through.</text>

  <!-- actors: x centres 150, 470, 800, 1130, 1450 -->
  <rect x="50" y="125" width="200" height="70" rx="12" fill="#212134"/>
  <text x="150" y="157" class="actor" text-anchor="middle">Editor</text>
  <text x="150" y="180" class="actorsub" text-anchor="middle">a person</text>
  <rect x="360" y="125" width="220" height="70" rx="12" fill="#4945FF"/>
  <text x="470" y="157" class="actor" text-anchor="middle">Chat window</text>
  <text x="470" y="180" class="actorsub" text-anchor="middle">browser · useChat</text>
  <rect x="690" y="125" width="220" height="70" rx="12" fill="#4945FF"/>
  <text x="800" y="157" class="actor" text-anchor="middle">/chat agent</text>
  <text x="800" y="180" class="actorsub" text-anchor="middle">Strapi · ToolLoopAgent</text>
  <rect x="1020" y="125" width="220" height="70" rx="12" fill="#212134"/>
  <text x="1130" y="157" class="actor" text-anchor="middle">Claude</text>
  <text x="1130" y="180" class="actorsub" text-anchor="middle">Anthropic API</text>
  <rect x="1340" y="125" width="220" height="70" rx="12" fill="#4945FF"/>
  <text x="1450" y="157" class="actor" text-anchor="middle">Strapi /mcp</text>
  <text x="1450" y="180" class="actorsub" text-anchor="middle">plugin's tools</text>

  <line x1="150" y1="195" x2="150" y2="1150" class="life"/>
  <line x1="470" y1="195" x2="470" y2="1150" class="life"/>
  <line x1="800" y1="195" x2="800" y2="1150" class="life"/>
  <line x1="1130" y1="195" x2="1130" y2="1150" class="life"/>
  <line x1="1450" y1="195" x2="1450" y2="1150" class="life"/>

  <!-- 1 -->
  <path d="M150 250 L466 250" class="call" marker-end="url(#d)"/>
  <text x="166" y="238" class="msg">types the request</text>
  <!-- 2 -->
  <path d="M470 310 L796 310" class="call" marker-end="url(#d)"/>
  <text x="486" y="298" class="msg">POST /chat · editor's admin token</text>
  <!-- 3 -->
  <path d="M800 370 L1446 370" class="call" marker-end="url(#d)"/>
  <text x="816" y="358" class="msg">connect with STRAPI_MCP_TOKEN · list tools · keep only the allowed ones</text>
  <!-- 4 -->
  <path d="M800 430 L1126 430" class="call" marker-end="url(#d)"/>
  <text x="816" y="418" class="msg">messages + instructions + tools</text>
  <!-- 5 -->
  <path d="M1130 490 L804 490" class="back" marker-end="url(#g)"/>
  <text x="816" y="478" class="ret">call list_posts, list_platforms</text>
  <!-- 6 -->
  <path d="M800 550 L1446 550" class="call" marker-end="url(#d)"/>
  <text x="816" y="538" class="msg">list_posts · list_platforms</text>
  <path d="M1450 590 L804 590" class="back" marker-end="url(#g)"/>
  <text x="816" y="578" class="ret">posts with postIds · Bluesky is on and ready</text>
  <!-- 7 -->
  <path d="M1130 650 L804 650" class="back" marker-end="url(#g)"/>
  <text x="816" y="638" class="ret">call publish_post { postId, platform: "bluesky" }</text>

  <!-- gate -->
  <rect x="300" y="680" width="1000" height="56" rx="12" fill="#FDF4DC" stroke="#D9822F" stroke-width="2"/>
  <text x="800" y="715" class="gate" text-anchor="middle">Loop pauses: publish_post needs approval. The request is signed with the admin secret.</text>

  <!-- 8 -->
  <path d="M800 780 L474 780" class="call" marker-end="url(#d)"/>
  <text x="486" y="768" class="msg">approval request (signed)</text>
  <!-- 9 -->
  <path d="M470 840 L154 840" class="call" marker-end="url(#d)"/>
  <text x="166" y="828" class="msg">“Publish to bluesky?” card</text>
  <!-- 10 -->
  <path d="M150 900 L466 900" class="human" marker-end="url(#o)"/>
  <text x="166" y="888" class="msg" style="fill:#8A4B00;font-weight:700">clicks Publish</text>
  <!-- 11 -->
  <path d="M470 960 L796 960" class="call" marker-end="url(#d)"/>
  <text x="486" y="948" class="msg">approval sent automatically</text>
  <!-- 12 -->
  <path d="M800 1020 L1446 1020" class="call" marker-end="url(#d)"/>
  <text x="816" y="1008" class="msg">publish_post → the same publishEntry() the buttons use</text>
  <path d="M1450 1060 L804 1060" class="back" marker-end="url(#g)"/>
  <text x="816" y="1048" class="ret">https://bsky.app/profile/…/post/…</text>
  <!-- 13 -->
  <path d="M800 1120 L474 1120" class="call" marker-end="url(#d)"/>
  <text x="486" y="1108" class="msg">streamed reply with the live URL</text>
</svg>
