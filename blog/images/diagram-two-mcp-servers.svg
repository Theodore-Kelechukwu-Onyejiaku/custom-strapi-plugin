<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #32324D; }
    .title { font-size: 34px; font-weight: 700; fill: #212134; }
    .sub { font-size: 19px; fill: #666687; }
    .group { font-size: 18px; font-weight: 700; letter-spacing: 1px; fill: #666687; }
    .name { font-size: 22px; font-weight: 700; fill: #212134; }
    .note { font-size: 16.5px; fill: #666687; }
    .code { font-size: 15px; font-family: Menlo, monospace; fill: #4945FF; }
    .light { fill: #FFFFFF; }
    .lightnote { font-size: 16.5px; fill: #DCDCFF; }
    .card { fill: #FFFFFF; stroke: #DCDCE4; stroke-width: 2; }
    .line { stroke: #8E8EA9; stroke-width: 2.5; fill: none; }
    .accent { stroke: #4945FF; stroke-width: 3; fill: none; }
    .lbl { font-size: 16px; fill: #4A4A6A; paint-order: stroke; stroke: #FFFFFF; stroke-width: 8px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8E8EA9"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4945FF"/></marker>
  </defs>

  <rect width="1600" height="790" fill="#F6F6F9"/>
  <text x="40" y="62" class="title">Two MCP servers, two jobs</text>
  <text x="40" y="94" class="sub">One teaches the coding assistant current Strapi. The other is shared by the assistant while building and by the chat in production.</text>

  <!-- Build time -->
  <rect x="40" y="130" width="740" height="590" rx="18" fill="#FFFFFF" stroke="#DCDCE4" stroke-width="2"/>
  <text x="64" y="166" class="group">WHILE BUILDING</text>

  <rect x="70" y="190" width="300" height="110" rx="14" fill="#212134"/>
  <text x="92" y="232" class="name light">Coding assistant</text>
  <text x="92" y="262" class="lightnote">Claude Code, Cursor …</text>
  <text x="92" y="286" class="lightnote">in your editor</text>

  <rect x="450" y="190" width="300" height="130" rx="14" class="card"/>
  <text x="472" y="230" class="name">Strapi Docs MCP</text>
  <text x="472" y="260" class="note">current Strapi 5 docs</text>
  <text x="472" y="295" class="code">strapi-docs.mcp.kapa.ai</text>
  <path d="M370 245 L446 245" class="line" marker-end="url(#g)"/>
  <text x="408" y="232" class="lbl" text-anchor="middle">asks</text>

  <text x="70" y="370" class="note">“How does a plugin register an MCP tool?”</text>
  <text x="70" y="396" class="note">Answered from the docs, not from Strapi 4 memories.</text>

  <rect x="70" y="440" width="680" height="250" rx="14" fill="#F0F0FF"/>
  <text x="92" y="478" class="name">Also connected to your local Strapi</text>
  <text x="92" y="512" class="note">The assistant reads the real content model (list_blog, list_tag)</text>
  <text x="92" y="538" class="note">and calls the plugin's own tools to check its work:</text>
  <text x="92" y="578" class="code">content_publisher_list_posts</text>
  <text x="92" y="606" class="code">content_publisher_list_platforms</text>
  <text x="92" y="650" class="note">Development token: read-only types + “Access the publishing table”.</text>

  <!-- Run time -->
  <rect x="820" y="130" width="740" height="590" rx="18" fill="#FFFFFF" stroke="#DCDCE4" stroke-width="2"/>
  <text x="844" y="166" class="group">IN PRODUCTION</text>

  <rect x="850" y="190" width="300" height="110" rx="14" fill="#4945FF"/>
  <text x="872" y="232" class="name light">The plugin's chat</text>
  <text x="872" y="262" class="lightnote">inside the Strapi admin</text>
  <text x="872" y="286" class="lightnote">for editors</text>

  <rect x="850" y="440" width="680" height="250" rx="14" fill="#EEF0FF" stroke="#4945FF" stroke-width="2"/>
  <text x="872" y="478" class="name">Strapi's own MCP server · /mcp</text>
  <text x="872" y="512" class="note">mcp: { enabled: true } in config/server.ts</text>
  <text x="872" y="552" class="code">list_* / get_*</text><text x="1140" y="552" class="note">read-only content</text>
  <text x="872" y="580" class="code">content_publisher_*</text><text x="1140" y="580" class="note">the plugin&apos;s tools</text>
  <text x="872" y="650" class="note">Production token: same narrow permissions, a different token.</text>

  <path d="M1000 300 L1000 436" class="accent" marker-end="url(#p)"/>
  <text x="1016" y="378" class="lbl">STRAPI_MCP_TOKEN</text>

  <!-- shared -->
  <path d="M750 565 C 790 565, 810 565, 846 565" class="accent" marker-end="url(#p)" stroke-dasharray="9 7"/>
  <text x="800" y="762" class="note" text-anchor="middle" style="fill:#4945FF;font-weight:700">Same tools, same permissions: what you test while building is what the chat calls.</text>
</svg>
